<body>
<div class="app">
  <header class="top"><div class="kj">氏族</div><h1>Générateur de bonus de clan</h1><p class="sub">Ajoute des bonus et des malus : l'aperçu et le code se mettent à jour tout seuls.</p>
    <div class="bar2"><button class="btn o" id="imp">Importer un code existant</button><button class="btn o" id="rs">Tout effacer</button></div></header>
  <div class="sec" id="impbox" hidden><h2>Importer un code existant</h2><div class="b">
    <textarea id="impta" style="min-height:140px" placeholder="Colle ici le code complet d'une fiche déjà faite (celui qui contient la div fiche_gen)…"></textarea>
    <p class="hint warn" id="imperr" hidden>Aucune fiche reconnue : colle le code complet, avec la div « fiche_gen ».</p>
    <div class="tools"><button class="btn" id="impgo">Charger ce code</button><button class="btn o" id="impno">Annuler</button></div></div></div>
  <div class="cols">
    <div class="main">
      <div class="sec"><h2>Clan</h2><div class="b">
        <div class="g"><label class="f">Nom du clan<input data-p="name" placeholder="Inuzuka"></label>
          <label class="f">Sous-titre<input data-p="sub" placeholder="Bonus de clan"></label></div>
        <label class="f">Logo du clan (lien de l'image)<input data-p="logo" placeholder="https://…"></label>
        <div class="g"><label class="f">Titre de la section<input data-p="bt"></label><label class="f">Kanji de la section<input data-p="bk" maxlength="3"></label><label class="f">Kanji d'en-tête<input data-p="kj" maxlength="3"></label></div>
        <label class="f">Texte du pied de page (vide = automatique)<input data-p="foot" placeholder="Sengoku no Jidai — Clan …"></label></div></div>
      <div class="sec"><h2>Couleurs</h2><div class="b"><div class="g">
        <label class="f">Couleur du clan (accent)<input type="color" data-p="accent"></label>
        <label class="f">Couleur de fond de la fiche<input type="color" data-p="bg"></label></div>
        <label class="chk"><input type="checkbox" data-p="bgOn">Utiliser cette couleur de fond (sinon : fond par défaut du site)</label></div></div>
      <div class="sec"><h2>Bonus &amp; malus</h2><div class="b"><div id="cards" style="display:flex;flex-direction:column;gap:12px"></div>
        <div class="tools"><button class="btn o" data-a="addb">+ Ajouter un bonus</button><button class="btn o" data-a="addm">+ Ajouter un malus</button></div>
        <label class="f" style="max-width:240px">Emplacements libres à la fin<input type="number" min="0" max="8" data-n data-p="empty"></label></div></div>
      <details class="sec"><summary>Réglages avancés</summary><div class="b"><label class="f">Lien du CSS des fiches<input data-p="css"></label></div></details>
    </div>
    <aside class="side"><div class="tabs"><button class="on" data-v="pv">Aperçu</button><button data-v="cd">Code</button></div>
      <div class="view" id="v-pv"><div class="pvw"><div id="pv"></div></div></div>
      <div class="view" id="v-cd" hidden><textarea id="code" readonly></textarea></div>
      <div class="acts"><button class="btn" id="cp" style="width:100%">Copier le code</button></div></aside>
  </div>
</div>
<div id="toast"></div>
<script>
const KEY='snj_bonus_gen',$=(s,r=document)=>r.querySelector(s);
const DEFCSS='https://dl.dropbox.com/scl/fi/m2kfoguztr4ipc30tqjj5/reglement_snj-1.css?rlkey=upvuiuuzd051s3sgwswpbl2s9&st=4d0y1jba&raw=1';
const PAL={or:'#c9a558',jauneor:'#f0c040',jaune:'#f5d033',orange:'#e8812a',rouge:'#d64545',bordeaux:'#a63a50',rose:'#e07aa6',violet:'#9b6fd1',bleu:'#4a90d9',cyan:'#45c4d6',vert:'#4caf7a',marron:'#a8774a',argent:'#b8bcc4',blanc:'#f0ede6',noir:'#6b6b78'};
const E=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),A=s=>E(s).replace(/"/g,'&quot;');
const newCard=t=>({t,n:'',img:'',p:'',tag:'',past:'',col:'auto',cc:'#6fbf8e'});
const DEF=()=>({name:'',sub:'Bonus de clan',logo:'',kj:'氏族',bt:'Bonus du clan',bk:'恩恵',foot:'',accent:'#f0c040',bgOn:false,bg:'#0a0908',empty:2,css:DEFCSS,cards:[newCard('b')]});
let S=DEF();try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&Array.isArray(o.cards))S=Object.assign(DEF(),o)}catch(e){}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1900)}
const rgb=h=>{h=(h||'#000000').replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16)||0).join(', ')};
const lum=h=>{const [r,g,b]=rgb(h).split(', ').map(Number);return (r*299+g*587+b*114)/1000};

/* ---------- génération du code (même structure que tes fiches) ---------- */
const fmt=(t,pv)=>{let s=E(t).replace(/\*\*([\s\S]+?)\*\*/g,'<b>$1</b>');if(pv)s=s.replace(/\[b\]([\s\S]*?)\[\/b\]/g,'<b>$1</b>');return s};
function gen(mode){const pv=mode=='pv',n=S.name||'Nom du clan';
  let st=`--bc-accent: ${S.accent}; --bc-accent-rgb: ${rgb(S.accent)};`+(S.bgOn?` background: ${S.bg};`:'');
  let h=(pv?'':`<link rel="stylesheet" href="${A(S.css.replace(/&amp;/g,'&'))}">`)+`<div class="fiche_gen bc_fiche" style="${st}"><!--\n`;
  h+=`--><div class="en_tete_gen"><!--\n--><div class="en-tete-kanji">${E(S.kj)}</div><!--\n`;
  if(S.logo.trim())h+=`--><div class="bc_blason"><img src="${A(S.logo.trim())}" alt="Blason du clan" referrerpolicy="no-referrer"></div><!--\n`;
  h+=`--><h2>${E(n.toUpperCase())}</h2><!--\n--><div class="bc_sous_titre">${E(S.sub)}</div><!--\n--><div class="sg-divider" style="margin: 20px;"><span class="sg-divider__line"></span><span class="sg-divider__diamond"></span><span class="sg-divider__line"></span></div><!--\n--></div><!--\n\n`;
  h+=`--><div class="ban_id"><!--\n--><h4>${E(S.bt)}</h4><!--\n--><h3>${E(S.bk)}</h3><!--\n--></div><!--\n\n--><div class="bc_liste"><!--\n\n`;
  S.cards.forEach(c=>{const m=c.t=='m',cls='bc_carte'+(m?' bc_malus':'')+(c.col!='auto'&&c.col!='perso'?' bc_c_'+c.col:''),
    sty=c.col=='perso'?` style="--bc-c: ${c.cc}; --bc-c-text: ${lum(c.cc)>150?'#0a0908':'#f5f0e6'};"`:'';
    h+=`--><div class="${cls}"${sty}><!--\n--><div class="bc_carre"><!--\n`;
    if(c.img.trim())h+=`--><img src="${A(c.img.trim())}" alt="${A(c.n)}" referrerpolicy="no-referrer"><!--\n`;
    h+=`--><div class="bc_tag">${E(c.tag||(m?'MALUS':'BONUS'))}</div><!--\n--></div><!--\n--><div class="bc_texte"><!--\n--><div class="bc_entete"><!--\n--><div class="bc_nom">${E(c.n)}</div><!--\n--><div class="bc_pastille">${E(c.past||(m?'Malus de clan':'Bonus de clan'))}</div><!--\n--></div><!--\n--><p>${fmt(c.p,pv)}</p><!--\n--></div><!--\n--></div><!--\n\n`});
  for(let i=0;i<(+S.empty||0);i++)h+='--><div class="bc_vide"><!--\n--><div class="bc_vide_carre"><span></span></div><!--\n--><div class="bc_vide_texte">Emplacement libre</div><!--\n--></div><!--\n\n';
  return h+`--></div><!--\n--><div class="pied_gen">${E(S.foot||'Sengoku no Jidai — Clan '+(S.name||''))}</div><!--\n--></div>`}

/* ---------- importer un code existant ---------- */
function importCode(src){const f=new DOMParser().parseFromString(src,'text/html').querySelector('.fiche_gen');if(!f)return false;
  const T=(el,q)=>{const x=el.querySelector(q);return x?x.textContent.trim():''},d=DEF(),st=f.getAttribute('style')||'';
  const ac=st.match(/--bc-accent:\s*(#[0-9a-f]{6})/i);d.accent=ac?ac[1]:(()=>{const k=[...f.classList].find(c=>/^bc_(?!fiche$)/.test(c)&&PAL[c.slice(3)]);return k?PAL[k.slice(3)]:'#f0c040'})();
  const bg=st.match(/(?:^|;)\s*background:\s*(#[0-9a-f]{6})/i);if(bg){d.bg=bg[1];d.bgOn=true}
  d.name=T(f,'.en_tete_gen h2').replace(/\s+/g,' ').toLowerCase().replace(/^./,c=>c.toUpperCase());d.sub=T(f,'.bc_sous_titre');d.kj=T(f,'.en-tete-kanji')||d.kj;
  const lg=f.querySelector('.bc_blason img');d.logo=lg?lg.getAttribute('src'):'';d.bt=T(f,'.ban_id h4')||d.bt;d.bk=T(f,'.ban_id h3')||d.bk;
  const ft=T(f,'.pied_gen');d.foot=ft==='Sengoku no Jidai — Clan '+d.name?'':ft;
  const lk=src.match(/<link[^>]*href="([^"]+)"/i);if(lk)d.css=lk[1].replace(/&amp;/g,'&');
  d.empty=f.querySelectorAll('.bc_vide').length;
  d.cards=[...f.querySelectorAll('.bc_carte')].map(e=>{const m=e.classList.contains('bc_malus'),c=newCard(m?'m':'b'),im=e.querySelector('.bc_carre img'),p=e.querySelector('.bc_texte p');
    c.n=T(e,'.bc_nom');c.img=im?im.getAttribute('src'):'';const tg=T(e,'.bc_tag'),ps=T(e,'.bc_pastille');
    c.tag=tg===(m?'MALUS':'BONUS')?'':tg;c.past=ps===(m?'Malus de clan':'Bonus de clan')?'':ps;
    if(p)c.p=p.innerHTML.replace(/<b>([\s\S]*?)<\/b>/g,'**$1**').replace(/<br\s*\/?>/g,'\n').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').trim();
    const k=[...e.classList].find(x=>/^bc_c_/.test(x));if(k&&PAL[k.slice(5)])c.col=k.slice(5);
    const pc=(e.getAttribute('style')||'').match(/--bc-c:\s*(#[0-9a-f]{6})/i);if(pc){c.col='perso';c.cc=pc[1]}return c});
  if(!d.cards.length)d.cards=[newCard('b')];S=d;return true}

/* ---------- interface ---------- */
const colOpts=c=>['auto',...Object.keys(PAL),'perso'].map(k=>`<option value="${k}"${k==c?' selected':''}>${k=='auto'?'Automatique (vert bonus / rouge malus)':k=='perso'?'Personnalisée…':k}</option>`).join('');
function renderCards(){$('#cards').innerHTML=S.cards.map((c,i)=>`<div class="card ${c.t=='m'?'m':'bo'}"><div class="ch"><b>${c.t=='m'?'Malus':'Bonus'} ${i+1}${c.n?' — '+E(c.n):''}</b>
<button class="x" data-a="up" data-i="${i}" ${i?'':'disabled'}>↑</button><button class="x" data-a="dn" data-i="${i}" ${i<S.cards.length-1?'':'disabled'}>↓</button><button class="x" data-a="del" data-i="${i}">✕</button></div>
<div class="g"><label class="f">Nom<input data-p="cards.${i}.n" value="${A(c.n)}" placeholder="Nom du ${c.t=='m'?'malus':'bonus'}"></label>
<label class="f">Type<select data-r data-p="cards.${i}.t"><option value="b"${c.t=='b'?' selected':''}>Bonus</option><option value="m"${c.t=='m'?' selected':''}>Malus</option></select></label></div>
<label class="f">Image (lien)<input data-p="cards.${i}.img" value="${A(c.img)}" placeholder="https://…"></label>
<label class="f">Description (<b>**gras**</b> possible, retours à la ligne conservés)<textarea data-p="cards.${i}.p">${E(c.p)}</textarea></label>
<div class="g"><label class="f">Couleur de la carte<select data-r data-p="cards.${i}.col">${colOpts(c.col)}</select></label>${c.col=='perso'?`<label class="f">Couleur personnalisée<input type="color" data-p="cards.${i}.cc" value="${c.cc}"></label>`:''}
<label class="f">Étiquette sur l'image<input data-p="cards.${i}.tag" value="${A(c.tag)}" placeholder="${c.t=='m'?'MALUS':'BONUS'}"></label>
<label class="f">Pastille<input data-p="cards.${i}.past" value="${A(c.past)}" placeholder="${c.t=='m'?'Malus de clan':'Bonus de clan'}"></label></div></div>`).join('')}
const get=p=>p.split('.').reduce((o,k)=>o[k],S),setP=(p,v)=>{const k=p.split('.'),l=k.pop();k.reduce((o,x)=>o[x],S)[l]=v};
function sync(){document.querySelectorAll('[data-p]').forEach(el=>{if(el.closest('#cards'))return;const v=get(el.dataset.p);el.type=='checkbox'?el.checked=!!v:el.value=v})}
let pvT,last='';const fit=()=>{const w=$('.pvw').clientWidth-16;if(w>0)$('#pv').style.zoom=Math.max(.35,Math.min(1,w/790))};
function pvUpd(){const h=gen('pv');if(h!==last){last=h;$('#pv').innerHTML=h}fit()}
function upd(){$('#code').value=gen('code');clearTimeout(pvT);pvT=setTimeout(pvUpd,300);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function render(){renderCards();sync();upd()}
document.addEventListener('input',e=>{const t=e.target,p=t.dataset.p;if(!p)return;setP(p,t.type=='checkbox'?t.checked:t.hasAttribute('data-n')?+t.value:t.value);if(t.dataset.r!=null)renderCards();else if(/^cards\.\d+\.n$/.test(p)){const i=p.split('.')[1];t.closest('.card').querySelector('.ch b').textContent=(S.cards[i].t=='m'?'Malus ':'Bonus ')+(+i+1)+(t.value?' — '+t.value:'')}upd()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const i=+b.dataset.i,a=b.dataset.a,C=S.cards;
  if(a=='addb')C.push(newCard('b'));if(a=='addm')C.push(newCard('m'));if(a=='del'){C.splice(i,1)}
  if(a=='up'&&i>0)C.splice(i-1,0,C.splice(i,1)[0]);if(a=='dn'&&i<C.length-1)C.splice(i+1,0,C.splice(i,1)[0]);render()});
document.querySelectorAll('.tabs [data-v]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs [data-v]').forEach(x=>x.classList.toggle('on',x==b));$('#v-pv').hidden=b.dataset.v!='pv';$('#v-cd').hidden=b.dataset.v!='cd';if(b.dataset.v=='pv')pvUpd()});
window.addEventListener('resize',fit);
$('#imp').onclick=()=>{$('#impbox').hidden=!$('#impbox').hidden;$('#imperr').hidden=true};
$('#impno').onclick=()=>$('#impbox').hidden=true;
$('#impgo').onclick=()=>{if(importCode($('#impta').value)){$('#impbox').hidden=true;$('#impta').value='';last='';render();toast('Code importé : tu peux le modifier')}else $('#imperr').hidden=false};
let rsT=null;$('#rs').onclick=function(){if(!rsT){this.textContent='Confirmer ?';rsT=setTimeout(()=>{this.textContent='Tout effacer';rsT=null},3000);return}clearTimeout(rsT);rsT=null;this.textContent='Tout effacer';S=DEF();last='';render()};
$('#cp').onclick=async function(){const o=this.textContent;try{await navigator.clipboard.writeText($('#code').value);this.textContent=(toast('Code copié dans le presse-papiers'),'Copié ✓')}catch(e){this.textContent='Va dans l\'onglet Code'}setTimeout(()=>this.textContent=o,1800)};
render();pvUpd();
</script>
</body>
</html>
